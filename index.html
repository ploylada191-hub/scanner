<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Barcode Scanner v2</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { background-color: #f5f5f5; text-align: center; font-family: sans-serif; padding: 20px; margin: 0; }
    h3 { color: #333; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #status { margin-top: 15px; color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <h3>📷 สแกนบาร์โค้ดยา (เวอร์ชันเร่งความเร็ว)</h3>
  <div id="reader"></div>
  <p id="status">กำลังเตรียมกล้อง...</p>

  <script>
    async function main() {
      await liff.init({ liffId: "2010509922-vDeep9SS" });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      document.getElementById('status').innerText = "กำลังสแกน... พยายามให้อยู่ในกรอบและเลี่ยงแสงสะท้อน";

      const html5QrCode = new Html5Qrcode("reader");
      
      // 🚀 1. บังคับให้ระบบถอดรหัสเฉพาะบาร์โค้ดสินค้า (EAN-13, EAN-8, Code 128) ไม่เสียเวลาไปสแกนโค้ดรูปแบบอื่น
      const formatsToSupport = [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128
      ];

      const config = { 
        fps: 25, // ปรับเพิ่มเฟรมเรตจาก 15 เป็น 25 เพื่อให้กล้องจับภาพได้ถี่และต่อเนื่องขึ้น
        qrbox: { width: 280, height: 120 }, // ปรับขนาดกล่องเล็งให้ยาวพอดีกับบาร์โค้ดแท่งยา
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true // 🔥 เปิดระบบใช้ชิปฮาร์ดแวร์ภายในเครื่องช่วยอ่านรหัส จะสแกนไวขึ้นมาก
        }
      }; 

      // เริ่มทำงานกล้องโดยกำหนดค่ารูปแบบเฉพาะ
      html5QrCode.start(
        { facingMode: "environment" }, 
        { ...config, formatsToSupport: formatsToSupport }, 
        async (decodedText) => {
          html5QrCode.stop(); // สแกนติดปุ๊บสั่งปิดกล้องทันที
          document.getElementById('status').innerText = "สแกนสำเร็จ! กำลังส่งข้อมูล...";
          document.getElementById('status').style.color = "green";
          
          await liff.sendMessages([{ type: "text", text: decodedText }]);
          liff.closeWindow(); 
          
        }, (errorMessage) => {
          // กำลังค้นหาต่อเนื่อง
        }
      ).catch((err) => {
          document.getElementById('status').innerText = "โปรดอนุญาตให้เข้าถึงกล้อง";
          document.getElementById('status').style.color = "red";
      });
    }
    
    main();
  </script>
</body>
</html>
