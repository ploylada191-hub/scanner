<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart OCR Scanner</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
  <style>
    body { background-color: #f5f5f5; text-align: center; font-family: sans-serif; padding: 15px; }
    #video { width: 100%; max-width: 400px; border-radius: 8px; }
    #result { font-size: 24px; font-weight: bold; color: #007bff; margin: 10px 0; }
    button { background-color: #007bff; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; font-size: 16px; }
  </style>
</head>
<body>
  <h3>📷 สแกนตัวเลขใต้บาร์โค้ด</h3>
  <video id="video" autoplay playsinline></video>
  <div id="result">เล็งตัวเลขให้ชัด...</div>
  <button onclick="capture()">📸 อ่านเลขจากภาพ</button>
  <p id="status" style="font-size: 12px; color: #666;">กดปุ่มเพื่ออ่านเลข (รอ AI ประมวลผล 2-3 วินาที)</p>

  <script>
    async function main() {
      await liff.init({ liffId: "2010509922-vDeep9SS" });
      const video = document.getElementById('video');
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream;
    }

    async function capture() {
      const video = document.getElementById('video');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      
      document.getElementById('status').innerText = "AI กำลังอ่านตัวเลข...";
      
      // ใช้ Tesseract อ่านตัวเลขจากภาพที่ถ่ายได้
      Tesseract.recognize(canvas, 'eng', { logger: m => console.log(m) })
        .then(({ data: { text } }) => {
          // ดึงเฉพาะตัวเลขที่พบในภาพ
          let numbers = text.replace(/[^0-9]/g, '');
          document.getElementById('result').innerText = numbers || "ไม่พบตัวเลข";
          
          if (numbers.length >= 5) {
            if(confirm("พบเลข: " + numbers + " ส่งเข้าแชทเลยไหม?")) {
              liff.sendMessages([{ type: "text", text: numbers }]);
              liff.closeWindow();
            }
          }
        });
    }
    main();
  </script>
</body>
</html>
