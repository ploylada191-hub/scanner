<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Barcode Scanner</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { background-color: #f5f5f5; text-align: center; font-family: sans-serif; padding: 20px; margin: 0; }
    h3 { color: #333; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #status { margin-top: 15px; color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <h3>📷 สแกนบาร์โค้ดยา</h3>
  <div id="reader"></div>
  <p id="status">กำลังเตรียมกล้อง...</p>

  <script>
    async function main() {
      // 1. ตรวจสอบการล็อกอิน LIFF
      await liff.init({ liffId: "2010509922-vDeep9SS" });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      document.getElementById('status').innerText = "กำลังค้นหาบาร์โค้ด... (พยายามหลบแสงสะท้อน)";

      // 2. ตั้งค่าเครื่องสแกนบาร์โค้ด
      const html5QrCode = new Html5Qrcode("reader");
      
      // สร้างกรอบสี่เหลี่ยมผืนผ้า (กว้าง 250 สูง 100) ให้พอดีกับบาร์โค้ดแท่ง
      const config = { fps: 15, qrbox: { width: 250, height: 100 } }; 

      // 3. เริ่มเปิดกล้องหลัง
      html5QrCode.start({ facingMode: "environment" }, config, async (decodedText) => {
          // เมื่อสแกนสำเร็จ
          html5QrCode.stop(); // ปิดกล้อง
          document.getElementById('status').innerText = "สแกนสำเร็จ! กำลังส่งข้อมูล...";
          document.getElementById('status').style.color = "green";
          
          // ส่งตัวเลขที่สแกนได้เข้าแชท LINE
          await liff.sendMessages([{ type: "text", text: decodedText }]);
          liff.closeWindow(); // ปิดหน้าต่างกลับไปหน้าแชท
          
      }, (errorMessage) => {
          // กรณีกล้องกำลังพยายามโฟกัส (ไม่ต้องทำอะไร)
      }).catch((err) => {
          document.getElementById('status').innerText = "โปรดอนุญาตให้ LINE เข้าถึงกล้องของคุณ";
          document.getElementById('status').style.color = "red";
      });
    }
    
    // เรียกใช้งานฟังก์ชัน
    main();
  </script>
</body>
</html>
