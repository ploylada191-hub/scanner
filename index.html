<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fast Number Scanner</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
  <style>
    body { margin: 0; background: #000; text-align: center; }
    #video { width: 100%; height: 60vh; object-fit: cover; }
    /* กรอบนำสายตา */
    .overlay { position: absolute; top: 10vh; left: 10%; width: 80%; height: 40vh; border: 3px solid #00ff00; pointer-events: none; }
    #result { color: #fff; padding: 20px; font-size: 20px; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <div class="overlay"></div>
  <div id="result">เล็งเลขไว้ในกรอบสีเขียว</div>
  <button style="padding: 15px 40px; font-size: 18px;" onclick="fastScan()">อ่านเลขทันที</button>

  <script>
    async function main() {
      await liff.init({ liffId: "2010509922-vDeep9SS" });
      const video = document.getElementById('video');
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream;
    }

    async function fastScan() {
      const video = document.getElementById('video');
      const canvas = document.createElement('canvas');
      // กำหนดขนาดให้โฟกัสเฉพาะตรงกลางที่กรอบเขียวอยู่
      canvas.width = 400; 
      canvas.height = 150;
      canvas.getContext('2d').drawImage(video, video.videoWidth*0.2, video.videoHeight*0.3, video.videoWidth*0.6, video.videoHeight*0.2, 0, 0, 400, 150);
      
      document.getElementById('result').innerText = "กำลังประมวลผล...";
      
      // ใช้ worker โหมดเร็ว
      const worker = Tesseract.createWorker({ logger: m => console.log(m) });
      await worker.load();
      await worker.loadLanguage('eng');
      await worker.initialize('eng');
      
      const { data: { text } } = await worker.recognize(canvas);
      let numbers = text.replace(/[^0-9]/g, '');
      
      document.getElementById('result').innerText = "พบเลข: " + numbers;
      if (numbers.length >= 6) {
          liff.sendMessages([{ type: "text", text: numbers }]);
          liff.closeWindow();
      } else {
          document.getElementById('result').innerText = "ไม่ชัด ลองใหม่ครับ";
      }
      await worker.terminate();
    }
    main();
  </script>
</body>
</html>
